info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3001/auth/login
  body:
    type: json
    data: |-
      {
        "email": "arnauddn6@gmail.com",
        "password": "password123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: 'bru.setEnvVar("tokenArnaud", res.body.access_token, { persist: true });'
    - type: tests
      code: |-
        test("Login renvoie 200 et un access_token", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.body).to.have.property("access_token");
        });

        test("Login ne renvoie pas le mot de passe", function () {
          expect(res.body.user).to.not.have.property("password");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
